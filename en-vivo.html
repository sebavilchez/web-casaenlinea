<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css" />
    <style>
        body { 
            background: #000; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .player-container { 
            width: 960px; 
            height: 540px; 
            max-width: 100%;
        }
        .player-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Añadido autoplay y muted (necesario para que los navegadores modernos permitan autoplay) -->
        <video id="player" playsinline autoplay muted controls></video>
    </div>

    <script src="https://cdn.plyr.io/3.8.4/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('#player');
            const hlsUrl = 'https://vtmsaopaulo.ezvizlife.com:4443/v3/openlive/GL4596791_1_1.m3u8?expire=1803360204&id=1013076267803619328&c=97a7ad672e&t=82fa89131a22fe6cd55cc159b49bce8696256c31d67cac03ca6dcd2ec53926f3&ev=100&u=926bb1a5e8e447229f5a780716111c13';

            const plyrOptions = {
                autoplay: true,
                muted: true,
                quality: {
                    default: 720,
                    options: [1080, 720, 480, 360],
                    forced: true,
                    onChange: (newQuality) => {
                        if (window.hls) {
                            window.hls.levels.forEach((level, index) => {
                                if (level.height === newQuality) {
                                    window.hls.currentLevel = index;
                                }
                            });
                        }
                    }
                },
                // Se removió 'progress' y 'current-time' del array de controles
                controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
            };

            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 10,
                    maxMaxBufferLength: 30,
                    liveSyncDurationCount: 3,
                });

                window.hls = hls;
                hls.loadSource(hlsUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    const availableQualities = hls.levels.map((l) => l.height);
                    if (availableQualities.length > 0) {
                        plyrOptions.quality.options = availableQualities;
                        plyrOptions.quality.default = availableQualities[availableQualities.length - 1];
                    }

                    const player = new Plyr(video, plyrOptions);
                    window.player = player;
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = hlsUrl;
                const player = new Plyr(video, plyrOptions);
            }
        });
    </script>
</body>
</html>
